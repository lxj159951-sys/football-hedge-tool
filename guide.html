<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>足球助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f1117, #1a1d29);
            color: #e4e6eb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .logo {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #a0a3b1;
            font-size: 16px;
            margin-bottom: 40px;
        }
        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 40px;
        }
        .feature {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 16px 12px;
        }
        .feature-icon { font-size: 24px; margin-bottom: 8px; }
        .feature-name { font-size: 14px; color: #a0a3b1; }
        .steps {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
        }
        .steps h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #667eea;
        }
        .step {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 20px;
            text-align: left;
        }
        .step:last-child { margin-bottom: 0; }
        .step-num {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }
        .step-content { flex: 1; }
        .step-title { font-weight: 600; margin-bottom: 4px; }
        .step-desc { font-size: 13px; color: #a0a3b1; }
        .arrow {
            font-size: 24px;
            color: #667eea;
            margin: 10px 0;
            animation: bounce 1s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(5px); }
        }
        .open-btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 16px 48px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
        }
        .open-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(102, 126, 234, 0.5); }
        .tip {
            margin-top: 20px;
            font-size: 12px;
            color: #6b6e7d;
        }
        .wechat-tip {
            background: rgba(240, 165, 0, 0.1);
            border: 1px solid rgba(240, 165, 0, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }
        .wechat-tip-icon { font-size: 24px; }
        .wechat-tip-text { font-size: 14px; color: #f0a500; }
        .browser-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .browser-icon {
            font-size: 32px;
            opacity: 0.5;
        }
        .browser-icon.active { opacity: 1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">⚽</div>
        <h1>足球助手</h1>
        <p class="subtitle">套利计算 · 盘中对冲 · 凯利公式 · 智能预测</p>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">💱</div>
                <div class="feature-name">套利计算器</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🛡️</div>
                <div class="feature-name">盘中对冲</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📐</div>
                <div class="feature-name">凯利公式</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🧠</div>
                <div class="feature-name">智能预测</div>
            </div>
        </div>

        <!-- 微信提示 -->
        <div class="wechat-tip" id="wechatTip" style="display: none;">
            <div class="wechat-tip-icon">💡</div>
            <div class="wechat-tip-text">
                <strong>微信用户请注意：</strong><br>
                请点击右上角 <strong>···</strong> 按钮，选择 <strong>「在浏览器打开」</strong> 以获得最佳体验
            </div>
        </div>

        <div class="steps">
            <h2>📱 如何使用</h2>
            <div class="step">
                <div class="step-num">1</div>
                <div class="step-content">
                    <div class="step-title">在浏览器中打开</div>
                    <div class="step-desc">使用 Safari、Chrome 等浏览器打开此页面</div>
                </div>
            </div>
            <div class="step">
                <div class="step-num">2</div>
                <div class="step-content">
                    <div class="step-title">添加到主屏幕</div>
                    <div class="step-desc">点击浏览器菜单，选择「添加到主屏幕」</div>
                </div>
            </div>
            <div class="step">
                <div class="step-num">3</div>
                <div class="step-content">
                    <div class="step-title">像 App 一样使用</div>
                    <div class="step-desc">从主屏幕打开，全屏显示，完全离线可用</div>
                </div>
            </div>
        </div>

        <a href="football-tool-offline.html" class="open-btn" id="openBtn">
            🚀 立即打开
        </a>

        <p class="tip">点击按钮打开工具，建议添加到主屏幕方便下次使用</p>

        <div class="browser-icons">
            <span class="browser-icon" title="Safari">🧭</span>
            <span class="browser-icon" title="Chrome">🌐</span>
            <span class="browser-icon" title="Firefox">🦊</span>
        </div>
    </div>

    <script>
        // 检测是否在微信中打开
        function isWeChat() {
            return /MicroMessenger/i.test(navigator.userAgent);
        }

        // 检测是否在 iOS
        function isIOS() {
            return /iPhone|iPad|iPod/i.test(navigator.userAgent);
        }

        // 显示微信提示
        if (isWeChat()) {
            document.getElementById('wechatTip').style.display = 'flex';
        }

        // 点击按钮时的处理
        document.getElementById('openBtn').addEventListener('click', function(e) {
            if (isWeChat()) {
                // 在微信中，提示用户在浏览器打开
                alert('请点击右上角 ··· 按钮，选择「在浏览器打开」');
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
